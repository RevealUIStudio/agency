name: Claim gates

# Marketing-site claim honesty against the agency tree.
# Builds @revealui/claim-gates from RevealUIStudio/revealui@test (same engines
# as monorepo validate:claims; no full-copy scanner in this repo).
#
# Requires claim-gates multi-root profiles on revealui test
# (revealui PR that lands marketing-site profile, or later).

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: claim-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"

jobs:
  claim-gates:
    name: marketing-site claim honesty
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout agency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: agency
          persist-credentials: false

      - name: Checkout revealui (claim-gates source)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: RevealUIStudio/revealui
          ref: test
          path: revealui
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: revealui/pnpm-lock.yaml

      - name: Install revealui workspace
        working-directory: revealui
        run: pnpm install --frozen-lockfile

      - name: Build claim-gates and workspace deps
        working-directory: revealui
        run: pnpm --filter @revealui/claim-gates... build

      - name: Run marketing-site profile (hard-fail)
        working-directory: revealui
        run: >
          node packages/claim-gates/dist/cli.js
          --root "$GITHUB_WORKSPACE/agency"
          --profile marketing-site
